name: build-and-deploy

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: codesageacr18467.azurecr.io
  IMAGE: codesage

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to VM
        env:
          SHA: ${{ github.sha }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          SCRIPT="set -e
          cd /home/azureuser/codesage
          echo '$ACR_PASSWORD' | docker login $REGISTRY -u $ACR_USERNAME --password-stdin
          sed -i -E 's|($REGISTRY/$IMAGE:)[^[:space:]]+|\1$SHA|g' docker-compose.yml
          docker compose pull
          docker compose up -d
          docker image prune -f"
          az vm run-command invoke -g codesage-rg -n codesage-vm \
            --command-id RunShellScript --scripts "$SCRIPT" \
            --query "value[0].message" -o tsv

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            curl -fsS https://codesage-api.centralindia.cloudapp.azure.com/health && exit 0
            sleep 10
          done
          echo "Health check failed" && exit 1
